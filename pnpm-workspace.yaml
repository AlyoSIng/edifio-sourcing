# pnpm 11 — allowBuilds : liste explicite des packages autorisés à exécuter des build scripts.
# Décision CTO 2026-05-18 : esbuild en JS pur — build script natif désactivé.
# sharp et unrs-resolver nécessitent leurs binaires natifs (images + résolution).
# Ref : https://pnpm.io/settings#allowbuilds
allowBuilds:
  esbuild: false
  sharp: true
  unrs-resolver: true
