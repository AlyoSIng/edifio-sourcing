name: ci-db-rls

# Trigger -- toute PR vers main ou feat/sourcing-mvp, et push direct sur ces
# branches. Le pgTAP est CI-only : il ne tourne PAS en local (decision CTO
# etape 4) car l'install pg_prove sur Windows + macOS est friable.
on:
  pull_request:
    branches:
      - main
      - feat/sourcing-mvp
  push:
    branches:
      - main
      - feat/sourcing-mvp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  rls:
    name: ci-db-rls
    runs-on: ubuntu-latest

    # Service Postgres 15 dedie a ce job. Les extensions uuid-ossp, pgcrypto,
    # pg_trgm sont activees par la migration `src/db/migrate.ts` au runtime
    # (cf. src/db/setup/extensions.sql).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edifio_sourcing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Connexion directe Postgres 5432 (jamais le pooler 6543 -- DDL drizzle-kit
      # incompatible avec PgBouncer transaction mode).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/edifio_sourcing_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pgTAP + pg_prove. pgTAP est l'extension Postgres (tests SQL natifs),
      # pg_prove est le runner Perl qui les execute.
      - name: Install pgTAP + pg_prove
        run: |
          set -e
          # Ubuntu Noble n'a pas postgresql-15-pgtap dans universe -> ajout du
          # depot officiel PGDG (apt.postgresql.org) qui maintient les paquets
          # PG 15 a jour pour toutes les versions Ubuntu supportees.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-15-pgtap libtap-parser-sourcehandler-pgtap-perl
          # pg_prove vient avec TAP::Parser::SourceHandler::pgTAP -- on verifie
          # qu'il est dispo.
          which pg_prove || sudo cpanm --notest TAP::Parser::SourceHandler::pgTAP
          pg_prove --version

      # L'install precedente met pg_prove + le module Perl sur le runner host,
      # mais pgtap.so / pgtap.control doivent vivre DANS le container Postgres
      # (services.postgres) pour que CREATE EXTENSION pgtap fonctionne. L'image
      # officielle postgres:15 est basee Debian bookworm et inclut deja le
      # depot PGDG, donc `apt-get install postgresql-15-pgtap` y fonctionne.
      - name: Install pgtap inside the postgres service container
        run: |
          set -e
          CONTAINER=$(docker ps --filter "ancestor=postgres:15" --format "{{.ID}}" | head -1)
          if [ -z "$CONTAINER" ]; then
            echo "ERROR: postgres:15 service container introuvable"
            docker ps
            exit 1
          fi
          docker exec "$CONTAINER" bash -c "apt-get update -qq && apt-get install -y -qq postgresql-15-pgtap"

      # Schema auth (Supabase) faux-stub pour que 0003_fk_supabase passe en CI
      # ET pour que les policies RLS qui referencent auth.jwt() ne plantent pas
      # a la creation. En prod Supabase, auth.users et auth.jwt() existent
      # nativement. Ici on les stub pour matcher le contrat utilise par 0002_rls.
      - name: Prepare Supabase auth schema stub
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          psql -h localhost -U postgres -d edifio_sourcing_test -c "CREATE SCHEMA IF NOT EXISTS auth;"
          psql -h localhost -U postgres -d edifio_sourcing_test -c "CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY, email text);"
          # Stub `auth.jwt()` -- en prod Supabase Auth pose cette fonction qui
          # renvoie les claims JWT en jsonb. La policy `tenant_isolation` sur
          # `notifications` y fait reference (cf. 0002_rls.sql:184).
          # En CI : retourne le setting request.jwt.claims s'il existe, sinon
          # NULL (acceptable : aucune session simulee n'est posee avant pgTAP).
          psql -h localhost -U postgres -d edifio_sourcing_test -c "CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb AS \$\$ SELECT NULLIF(current_setting('request.jwt.claims', true), '')::jsonb \$\$ LANGUAGE sql STABLE;"
          # Active pgTAP dans la DB cible (pour pg_prove).
          psql -h localhost -U postgres -d edifio_sourcing_test -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      # Migrations Drizzle (extensions + 0000 + 0001 + 0002 + 0003).
      - name: Run migrations (extensions + drizzle)
        run: pnpm db:migrate

      # Role non-superuser pour les tests pgTAP. pg_prove tourne par defaut en
      # postgres (superuser -> bypass RLS inconditionnel en PG 15, meme avec
      # FORCE ROW LEVEL SECURITY). On cree un role applicatif sans BYPASSRLS,
      # et chaque test pgTAP fait `SET LOCAL ROLE test_authenticated` avant la
      # phase d'assertion. Le setup data reste en superuser (bypass volontaire
      # pour inserer les fixtures sans contraintes RLS).
      - name: Create non-superuser role for RLS assertions
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          psql -h localhost -U postgres -d edifio_sourcing_test -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE test_authenticated NOINHERIT NOLOGIN;
          GRANT USAGE ON SCHEMA public, auth TO test_authenticated;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO test_authenticated;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO test_authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO test_authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO test_authenticated;
          SQL

      # Seed dev/CI : 2 orgs + 200 tenders + ai_runs + brevo_messages + audit.
      # Pose la fixture BOAMP committee + assertions condition 2 ADR-013
      # (mediane raw_data 25 KB +/- tolerance). Le seed pgTAP isole ses propres
      # donnees via BEGIN ... ROLLBACK, donc le seed reste en place pour
      # eventuels jobs downstream (smoke tests RLS), sans collision.
      - name: Seed dev/CI dataset (condition 2 ADR-013 -- payload reel)
        run: pnpm db:seed

      # Lance la suite pgTAP. pg_prove charge les .sql un par un.
      - name: Run pgTAP suite
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          pg_prove \
            --host localhost \
            --username postgres \
            --dbname edifio_sourcing_test \
            --ext .sql \
            tests/rls/
