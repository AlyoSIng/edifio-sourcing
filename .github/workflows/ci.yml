name: ci

# Triggers — toute PR vers main et tout push direct sur main.
# Le push direct main est en deny côté allowlist Claude Code ; la CI ici sert
# de filet pour les merges effectifs (squash) et l'auto-deploy Vercel.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Annule les runs en cours sur la même branche si un nouveau commit arrive.
# Évite les builds parallèles inutiles sur les PR actives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales — la CI ne pousse rien, elle lit + commente PR.
permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: ci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: ci-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: ci-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  # Vérification BLOQUANTE de présence du middleware racine et de ses gardes.
  # ADR-014 (Board 2026-06-05, ouverture multi-tenant) : le filtre de domaine
  # `@alyosingenierie.fr` (+ helper isAuthorizedEmail) a été RETIRÉ du
  # middleware — les anciens greps rendaient ce job structurellement rouge.
  # CLAUDE.md (Limites strictes) : TOUTES les autres gardes restent
  # obligatoires — auth (getUser) + must_change_password + rôles
  # admin / superadmin. Ce job échoue si l'une d'elles disparaît.
  middleware-check:
    name: ci-middleware-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify middleware presence + auth/password/role guards (ADR-014)
        run: |
          set -e
          test -f src/middleware.ts || { echo "::error file=src/middleware.ts::middleware.ts MISSING — REJECTED"; exit 1; }
          grep -qF "supabase.auth.getUser()" src/middleware.ts || { echo "::error file=src/middleware.ts::auth guard supabase.auth.getUser() MISSING"; exit 1; }
          grep -qF "mustChangePassword(profile)" src/middleware.ts || { echo "::error file=src/middleware.ts::must_change_password gate MISSING"; exit 1; }
          grep -qF "isProvisionalPasswordExpired(profile)" src/middleware.ts || { echo "::error file=src/middleware.ts::provisional password expiry gate MISSING"; exit 1; }
          grep -qF "isAdminRoute(pathname)" src/middleware.ts || { echo "::error file=src/middleware.ts::admin route gate MISSING"; exit 1; }
          grep -qF "isSuperAdminRoute(pathname)" src/middleware.ts || { echo "::error file=src/middleware.ts::superadmin route gate MISSING"; exit 1; }
          grep -qF "isSuperAdmin(profile)" src/middleware.ts || { echo "::error file=src/middleware.ts::superadmin role check MISSING"; exit 1; }
          echo "✓ middleware présent + gardes auth / must_change_password / admin / superadmin câblées (ADR-014)"

  e2e:
    name: ci-e2e
    runs-on: ubuntu-latest
    # `supabase start` télécharge ~6-8 images Docker au premier boot (~2-3 min,
    # pas de cache d'images entre runs sur les runners hosted) + build Next
    # (~1 min) + suite Playwright. 30 min = marge large sans job zombie.
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_ENV: preview
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ALLOWED_EMAIL_DOMAIN: alyosingenierie.fr
      # ------------------------------------------------------------------
      # Stack Supabase LOCALE éphémère dans le runner (décision A3, visio
      # cadrage 10/06) : AUCUN secret GitHub requis. L'incident 2026-06-10
      # (fixtures seedées en PROD via secrets mal câblés) devient
      # structurellement impossible : la cible est 127.0.0.1, détruite avec
      # le runner. URL + ports figés par supabase/config.toml (committé).
      # Les clés ANON / SERVICE_ROLE locales sont les clés de démo PUBLIQUES
      # du CLI, exportées par le step « Export Supabase local keys ».
      # Défense en profondeur conservée : assertNotProdUrl()
      # (src/lib/e2e/anti-prod-guard.ts) + step « Anti-prod guard » ci-dessous.
      # ------------------------------------------------------------------
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      # Connexion directe Postgres locale (port 54322, cf. supabase/config.toml).
      # Lue par : src/db/migrate.ts (mode URL), pnpm db:seed, le webServer
      # Playwright (`pnpm build && pnpm start`) pour les pages métier BDD, et
      # les specs `test.skip(!hasDatabase)` — qui ne se skippent donc PLUS.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Resend — valeurs FACTICES : aucune spec n'asserte un envoi réussi.
      # forgot-password absorbe l'erreur (succès apparent anti-énumération,
      # cf. src/lib/email/resend.ts) et les specs multi-org acceptent
      # explicitement « Resend KO en CI » (s5, s8, s13).
      RESEND_API_KEY: re_fake_local_e2e_key
      RESEND_FROM_EMAIL: no-reply@alyosingenierie.fr
      # CRON_SECRET factice : les specs cron ne testent que les chemins 401
      # (bearer absent / incorrect — cf. tandem.spec §4, s6, s14), jamais un
      # run réel. Valeur publique mais ne protège que le serveur du runner.
      CRON_SECRET: e2e-local-cron-secret-not-a-real-secret
      # Ouvre la route /api/test/seed-session — la triple-gate refuse
      # silencieusement (404) en production même si cette var est posée par
      # erreur (cf. src/app/api/test/seed-session/route.ts).
      # Requise pour le helper E2E `signInWith` post-refactor 2026-05-16.
      E2E_TEST_ROUTES_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------
      # Stack Supabase locale : Postgres 15 + GoTrue + PostgREST + Kong
      # + Storage (requis : la migration 0032 INSERT le bucket `org-assets`
      # dans storage.buckets — sans storage-api, la table reste en forme
      # minimale et le migrate échoue ; cf. supabase/config.toml [storage]).
      # Studio / inbucket / realtime / edge_runtime / analytics restent
      # désactivés dans supabase/config.toml (exclusion déclarative,
      # robuste aux renommages de containers entre versions CLI — ex.
      # inbucket → mailpit — contrairement aux flags `supabase start -x`).
      # ------------------------------------------------------------------
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boot attendu : ~2-3 min (pull des images Docker).
      - name: Start local Supabase stack
        run: supabase start

      # Récupère les clés de démo locales (PUBLIQUES — pas des secrets) et les
      # exporte pour les steps suivants : helpers admin SDK côté runner
      # (e2e/helpers/password.ts, e2e/fixtures/multi-org-seed.ts) + webServer
      # Next (middleware, seed-session, server actions service_role).
      - name: Export Supabase local keys
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          if [ -z "${ANON_KEY:-}" ] || [ -z "${SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::ANON_KEY / SERVICE_ROLE_KEY introuvables dans 'supabase status -o env'. Clés disponibles :"
            supabase status -o env | cut -d= -f1
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      # Garde anti-prod conservée en défense en profondeur (incident
      # 2026-06-10) : plus de secrets PREVIEW_* à vérifier, mais on refuse
      # toujours (1) toute URL contenant le project ref PROD — à garder
      # aligné avec src/lib/e2e/anti-prod-guard.ts — et (2) toute cible
      # Supabase non locale. Comparaison lowercase (case glob sensible à la
      # casse par défaut — review Hugo).
      - name: Anti-prod guard (defense in depth)
        run: |
          set -e
          for URL in "$NEXT_PUBLIC_SUPABASE_URL" "$DATABASE_URL"; do
            URL_LC="$(printf '%s' "$URL" | tr '[:upper:]' '[:lower:]')"
            case "$URL_LC" in
              *loogmtltwkhvczdiurqs*)
                echo "::error::REFUS — une URL cible le projet Supabase PROD. Le job ci-e2e seede la BDD et ne doit JAMAIS pointer la prod (incident 2026-06-10, cf. DECISIONS.md)."
                exit 1
                ;;
            esac
          done
          case "$NEXT_PUBLIC_SUPABASE_URL" in
            http://127.0.0.1:* | http://localhost:*) ;;
            *)
              echo "::error::REFUS — NEXT_PUBLIC_SUPABASE_URL n'est pas la stack locale (attendu http://127.0.0.1:54321)."
              exit 1
              ;;
          esac
          echo "OK — cible Supabase locale, non-prod"

      # Schéma : migrator custom (extensions + une TX par migration, cf.
      # src/db/migrate.ts — DATABASE_URL suffit, mode URL). auth.users /
      # auth.uid() / auth.jwt() existent NATIVEMENT sur la stack locale
      # (parité prod — pas besoin du stub auth de db-rls.yml).
      - name: Run migrations
        run: pnpm db:migrate

      # Baseline dev/CI (2 orgs, profils de recherche actifs, tenders
      # `sourced`, ai_prompts...) : sans elle, les specs BDD (tender-actions,
      # ao-du-jour, admin-profil) tournent sur une base vide → EmptyState /
      # skip. Idempotent (UUID stables + ON CONFLICT DO NOTHING).
      - name: Seed baseline dataset
        run: pnpm db:seed

      # Cache des binaires Chromium (~150 MB) — clé par version Playwright.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium (with system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # Quand le cache hit, on installe juste les system deps Linux nécessaires
      # (libnss3, libasound2, ...) sans re-télécharger le binaire.
      - name: Install Chromium system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # Périmètre élargi vs ancien job : avec DATABASE_URL + seed, les specs
      # métier BDD tournent désormais en plus de middleware/auth.
      - name: Run E2E tests (local Supabase stack)
        run: pnpm test:e2e

      # En cas d'échec, on uploade le rapport HTML + traces Playwright pour
      # debug — disponibles dans l'onglet Artifacts du run GitHub Actions.
      - name: Upload Playwright report (failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    name: ci-build
    runs-on: ubuntu-latest
    env:
      # Le build Next.js inline les NEXT_PUBLIC_* dans le bundle client.
      # On utilise les mêmes secrets que pour l'E2E pour produire un bundle
      # cohérent avec ce que Vercel preview livrera ; sinon le build passe
      # quand même (les vars sont validées à runtime), juste avec des refs
      # `undefined` dans le code généré.
      NEXT_PUBLIC_APP_ENV: preview
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ALLOWED_EMAIL_DOMAIN: alyosingenierie.fr
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Cache .next/cache pour accélérer les builds incrémentaux.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.{ts,tsx,css}') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build
